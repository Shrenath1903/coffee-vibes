<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Coffee Vibes</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<audio id="bgMusic" loop>
<source src="blue.mp3">
</audio>

<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>Coffee Vibes</h1>

<p>Good Coffee • Good Vibes</p>

<button id="musicBtn">
🎵 Play Music
</button>

</div>

</header>

<section class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search menu..."
>

</section>

<section class="filters" id="filters">

<button class="active" data-filter="all">
All
</button>

</section>

<section class="menu-grid" id="menuGrid"></section>

<div class="imageModal" id="imageModal">

<span class="closeImage">&times;</span>

<img id="previewImage">

</div>

<div class="detailsModal" id="detailsModal">

<div class="details-content">

<span class="closeDetails">&times;</span>

<img id="detailImage">

<h2 id="detailTitle"></h2>

<div class="price" id="detailPrice"></div>

<h3>How It's Made</h3>
<p id="detailMaking"></p>

<h3>Taste Profile</h3>
<p id="detailTaste"></p>

<h3>Ingredients</h3>
<p id="detailIngredients"></p>

</div>

</div>

<script src="menu-data.js"></script>
<script src="script.js"></script>

</body>
</html>
